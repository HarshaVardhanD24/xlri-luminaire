name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check the Google Sheet link is set
        env:
          VITE_SHEETS_ENDPOINT: ${{ vars.SHEETS_ENDPOINT }}
        run: |
          if [[ ! "$VITE_SHEETS_ENDPOINT" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]]; then
            echo "::error::Add the SHEETS_ENDPOINT repository variable (your Apps Script web app URL ending in /exec). See DEPLOY.md step B3."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Your Apps Script web app URL (ends in /exec). Set it under
          # Settings → Secrets and variables → Actions → Variables → SHEETS_ENDPOINT.
          # It is a public endpoint, not a secret. Scores are marked there, never in the browser.
          VITE_SHEETS_ENDPOINT: ${{ vars.SHEETS_ENDPOINT }}
      - name: Make sure no answer key was bundled
        run: |
          if ls -R dist | grep -q answer-key; then echo "::error::Answer key found in the build"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
